[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "T3 keyboard shortcuts in the portable preferences snapshot"
condition = "AND"
paths = ['''^config/t3code/preferences\.json$''']
regexTarget = "match"
regexes = ['''^key": "mod\+shift\+(enter|arrowup|arrowdown)"$''']
