name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: for file in install.sh install/*.zsh; do zsh -n "$file" || exit 1; done
      - run: for file in zsh/*.zsh zsh/*.symlink zsh/functions/*; do zsh -n "$file" || exit; done
      - name: Lint scripts by interpreter
        shell: bash
        run: |
          sh_files=()
          for file in bin/* git/hooks/* git/templates/hooks/* config/sketchybar/plugins/* config/sketchybar/sketchybarrc; do
            [[ -f "$file" ]] || continue
            case "$(head -n 1 "$file")" in
              *zsh*) zsh -n "$file" || exit 1 ;;
              *bash* | */sh*) sh_files+=("$file") ;;
            esac
          done
          shellcheck -S warning "${sh_files[@]}"
      - run: ruby -c bin/gbrt
      - uses: lunarmodules/luacheck@cc089e3f65acdd1ef8716cc73a3eca24a6b845e4 # v1.2.0
        with:
          args: config/nvim --no-color --codes --globals vim M Snacks dd --no-max-line-length --no-unused

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require GitGuardian API key
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "::error::GITGUARDIAN_API_KEY is unavailable. Fork pull requests get no secrets, and Dependabot pull requests need it under Dependabot secrets. A maintainer must scan these changes."
            exit 1
          fi
      - uses: GitGuardian/ggshield-action@5cc1ed2be3e8bf625d354c7170731880670f74de # v1.56.1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
