name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    # Only arm auto-merge for non-draft PRs from the owner, members,
    # collaborators, or prior contributors. The merge itself still waits
    # for the ruleset's required status checks and reviews.
    if: >-
      !github.event.pull_request.draft &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'),
        github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Auto-merge waits for the ruleset's required checks and reviews;
        # GitHub merges the PR itself once they all pass.
        run: gh pr merge "$PR_URL" --auto --squash
