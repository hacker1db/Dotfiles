prSections:
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Involved
      filters: is:open involves:@me -author:@me -review-requested:@me
    - title: 🌳 Trunk Reviews
      filters: is:open review-requested:@me label:tier:trunk
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 0.45
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings:
    prs:
        - key: enter
          name: open in Neovim (Octo)
          command: pr-review https://github.com/{{.RepoName}}/pull/{{.PrNumber}}
        - key: N
          name: review in Neovim (Octo)
          command: tmux new-window -n "pr-{{.PrNumber}}" "nvim -c 'Octo https://github.com/{{.RepoName}}/pull/{{.PrNumber}}'"
        - key: T
          name: files by tier in Neovim
          command: tmux new-window -n "tier-{{.PrNumber}}" "nvim -c 'PrTiers https://github.com/{{.RepoName}}/pull/{{.PrNumber}}'"
        - key: I
          name: agent review in Neovim
          command: tmux new-window -n "agent-{{.PrNumber}}" "nvim -c 'PrAgent https://github.com/{{.RepoName}}/pull/{{.PrNumber}}'"
        - key: F
          name: agent findings in Neovim
          command: tmux new-window -n "findings-{{.PrNumber}}" "nvim -c 'PrFindings https://github.com/{{.RepoName}}/pull/{{.PrNumber}}'"
repoPaths: {}
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
pager:
    diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
