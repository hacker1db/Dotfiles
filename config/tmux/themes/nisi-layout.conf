# vim:ft=tmux
# Nisi bar layout — nicknisi/dotfiles theme.tmux (MIT) rendered static for the
# Tokyo Night palette: session crest, rainbow window digits, badges. Sourced
# after tmuxlayout.conf when the nisi theme is active, so it overrides the
# default layout; bin/tmux-session-mood draws the crests from @thm_sl_*.

set -g @thm_sl_fg "#a9b1d6"
set -g @thm_sl_dim "#565f89"
set -g @thm_sl_muted "#606889"
set -g @thm_sl_surface "#24283b"
set -g @thm_sl_ink "#1a1b26"
set -g @thm_sl_red "#f7768e"
set -g @thm_sl_yellow "#e0af68"
set -g @thm_sl_orange "#eb927b"
set -g @thm_sl_green "#9ece6a"
set -g @thm_sl_cyan "#0db9d7"
set -g @thm_sl_teal "#449dab"
set -g @thm_sl_blue "#7aa2f7"
set -g @thm_sl_lavender "#b4bee6"
set -g @thm_sl_magenta "#ad8ee6"
set -g @thm_sl_pink "#7aa2f7"
set -g @thm_sl_purple "#7aa2f7"
set -g @thm_sl_accent "#7aa2f7"

set -g status-position top
set -g status-justify left
set -g status-left-length 120
set -g status-right-length 200

set -g message-style "fg=#a9b1d6,bg=#24283b,bold,align=centre"
set -g message-command-style "fg=#7aa2f7,bg=#24283b,bold,align=centre"

set-window-option -g pane-active-border-style "fg=#414868,bg=#414868"
set-window-option -g pane-border-style "fg=#414868,bg=#414868"
set-window-option -g pane-border-lines simple

set -g status-style "bg=default,fg=#a9b1d6"
set -g window-style "fg=default,bg=default"
set -g window-active-style "fg=default,bg=default"

setw -g window-status-separator "  "
setw -g window-status-bell-style default
setw -g window-status-activity-style default
setw -g window-status-format " #{?client_prefix,#[fg=#e0af68],#{?#{==:#{window_index},1},#[fg=#7aa2f7],#{?#{==:#{window_index},2},#[fg=#0db9d7],#{?#{==:#{window_index},3},#[fg=#9ece6a],#{?#{==:#{window_index},4},#[fg=#e0af68],#{?#{==:#{window_index},5},#[fg=#eb927b],#{?#{==:#{window_index},6},#[fg=#f7768e],#{?#{==:#{window_index},7},#[fg=#ad8ee6],#{?#{==:#{window_index},8},#[fg=#7aa2f7],#{?#{==:#{window_index},9},#[fg=#449dab],#{?#{==:#{window_index},10},#[fg=#b4bee6],#[fg=#7aa2f7]}}}}}}}}}}}#{?#{==:#{window_index},1},➀,#{?#{==:#{window_index},2},➁,#{?#{==:#{window_index},3},➂,#{?#{==:#{window_index},4},➃,#{?#{==:#{window_index},5},➄,#{?#{==:#{window_index},6},➅,#{?#{==:#{window_index},7},➆,#{?#{==:#{window_index},8},➇,#{?#{==:#{window_index},9},➈,#{?#{==:#{window_index},10},➉,#I}}}}}}}}}} #{?window_bell_flag,#[fg=#f7768e]#[bold],#[fg=#565f89]}#{?#{window_name},#{=/32/…:window_name},#{b:pane_current_path}}#[nobold]#{?window_zoomed_flag, #[fg=#eb927b]⊕,}#{?pane_synchronized, #[fg=#f7768e]⇄,}#{?window_marked_flag, #[fg=#7aa2f7]⚑,} "
setw -g window-status-current-format " #{?client_prefix,#[fg=#e0af68],#{?#{==:#{window_index},1},#[fg=#7aa2f7],#{?#{==:#{window_index},2},#[fg=#0db9d7],#{?#{==:#{window_index},3},#[fg=#9ece6a],#{?#{==:#{window_index},4},#[fg=#e0af68],#{?#{==:#{window_index},5},#[fg=#eb927b],#{?#{==:#{window_index},6},#[fg=#f7768e],#{?#{==:#{window_index},7},#[fg=#ad8ee6],#{?#{==:#{window_index},8},#[fg=#7aa2f7],#{?#{==:#{window_index},9},#[fg=#449dab],#{?#{==:#{window_index},10},#[fg=#b4bee6],#[fg=#7aa2f7]}}}}}}}}}}}#[bold]#{?#{==:#{window_index},1},➊,#{?#{==:#{window_index},2},➋,#{?#{==:#{window_index},3},➌,#{?#{==:#{window_index},4},➍,#{?#{==:#{window_index},5},➎,#{?#{==:#{window_index},6},➏,#{?#{==:#{window_index},7},➐,#{?#{==:#{window_index},8},➑,#{?#{==:#{window_index},9},➒,#{?#{==:#{window_index},10},➓,#I}}}}}}}}}}#[nobold] #{?window_bell_flag,#[fg=#f7768e],#[fg=#a9b1d6]}#[bold]#{?#{window_name},#{=/32/…:window_name},#{b:pane_current_path}}#[nobold]#{?window_zoomed_flag, #[fg=#eb927b]⊕,}#{?pane_synchronized, #[fg=#f7768e]⇄,}#{?window_marked_flag, #[fg=#7aa2f7]⚑,} "

set -g status-left "  #{?client_prefix,#[fg=#e0af68]#[bold]󱐋 #S#[default],#($HOME/.config/tmux/../../bin/tmux-session-mood current '#{session_name}' '#{session_many_attached}')}   "
set -g status-right "#{?pane_in_mode,#[fg=#e0af68]#[bold]◈ #{s/-mode//:pane_mode}#{?scroll_position, ↑#{scroll_position},}#[default]  ,}#($HOME/.config/tmux/../../bin/tmux-session-mood others '#{client_session}')"

setw -g clock-mode-colour "#4a5e8e"
