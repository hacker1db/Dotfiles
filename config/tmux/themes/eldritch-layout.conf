# vim:ft=tmux
# Eldritch bar layout — nicknisi/dotfiles theme.tmux as of 2026-04 (91ea830e,
# MIT), rendered static for the eldritch palette. Sourced after tmuxlayout.conf
# when the eldritch theme is active.

set -g status-position top
set -g status-bg "default"
set -g status-justify "left"
set -g status-left-length 100
set -g status-right-length 100

set -g message-style "fg=#04d1f9,bg=#292e42,align=centre"
set -g message-command-style "fg=#04d1f9,bg=#292e42,align=centre"

set-window-option -g pane-active-border-style "fg=#f265b5,bg=#f265b5"
set-window-option -g pane-border-style "fg=#292e42,bg=#292e42"
set-window-option -g pane-border-lines simple

setw -g window-status-activity-style "fg=#ebfafa,none"
setw -g window-status-separator ' #[fg=#292e42]│ '
set -g status-style "bg=default,fg=white"

setw -g window-status-format '#[fg=#3b4261]#{?#{window_name},#W,#{b:pane_current_path}}'
setw -g window-status-current-format '#[fg=#f265b5,bold]#{?#{window_name},#W,#{b:pane_current_path}}'

set -g status-left '#[bg=#a48cf2,fg=#212337,bold]  #S #[bg=default]#[fg=#a48cf2]#[bg=default,fg=default]'
set -g status-right '#(~/.config/tmux/../../bin/tmux-fleet-chips) #(song=$(~/.config/tmux/../../bin/current-song); if [ -n "$song" ]; then echo "#[bg=default]#[fg=#f265b5]#[bg=#f265b5]#[fg=#212337]   $song #[bg=default]#[fg=#f265b5]#[bg=default,fg=default]"; fi)#[bg=default]#[fg=#212337]#[bg=#212337]#[fg=#ebfafa]  #[bold]#(~/.config/tmux/../../bin/tmux-git-status "#{pane_current_path}") #[bg=default,fg=default]'

setw -g clock-mode-colour "#485284"
